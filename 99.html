<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法表挑战游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6ecbf5, #c2e9fb);
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .score, .level, .timer {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
        }

        .progress-container {
            margin: 15px 0;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            margin-top: 5px;
            font-size: 14px;
            color: #666;
        }

        .game-area {
            margin: 20px 0;
        }

        .question-container {
            margin-bottom: 25px;
        }

        .question {
            font-size: 36px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 10px;
            border-left: 5px solid #e74c3c;
        }

        .input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #answer-input {
            padding: 12px 15px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }

        #answer-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
        }

        #submit-btn, #start-btn, #reset-btn {
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #submit-btn {
            background-color: #2ecc71;
            color: white;
        }

        #submit-btn:hover {
            background-color: #27ae60;
        }

        #submit-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #start-btn {
            background-color: #3498db;
            color: white;
            margin-right: 10px;
        }

        #start-btn:hover {
            background-color: #2980b9;
        }

        #reset-btn {
            background-color: #e74c3c;
            color: white;
        }

        #reset-btn:hover {
            background-color: #c0392b;
        }

        .game-status {
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            min-height: 30px;
        }

        .correct {
            color: #27ae60;
        }

        .incorrect {
            color: #e74c3c;
        }

        .controls {
            margin: 20px 0;
        }
        
        /* 错题展示区域 */
        .mistakes-container {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
        }
        
        .mistakes-title {
            font-size: 18px;
            font-weight: bold;
            color: #856404;
            margin-bottom: 10px;
        }
        
        .mistake-item {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .continue-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffc107;
            color: #212529;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .continue-btn:hover {
            background-color: #e0a800;
        }

        /* 烟火粒子效果 */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* 撒花效果 */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.8;
            border-radius: 50%;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .question {
                font-size: 28px;
            }
            
            #answer-input {
                width: 120px;
                font-size: 18px;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .mistakes-container {
                font-size: 14px;
            }
            
            .mistake-item {
                display: block;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>九九乘法表挑战游戏</h1>
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="level">等级: <span id="current-level">1</span>/10</div>
            <div class="timer">时间: <span id="timer">00:00</span></div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="progress-text">进度: <span id="progress-text">0</span>/5</div>
        </div>
        
        <div class="game-area">
            <div class="question-container">
                <div class="question" id="question">点击开始游戏</div>
                <div class="input-container">
                    <input type="number" id="answer-input" placeholder="输入答案" autocomplete="off">
                    <button id="submit-btn">提交</button>
                </div>
            </div>
            
            <div class="mistakes-container" id="mistakes-container">
                <div class="mistakes-title">本关错题回顾：</div>
                <div id="mistakes-list"></div>
                <button class="continue-btn" id="continue-btn">继续下一关</button>
            </div>
            
            <div class="controls">
                <button id="start-btn">开始游戏</button>
                <button id="reset-btn">重新开始</button>
            </div>
        </div>
        
        <div class="game-status" id="game-status"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏状态
            let score = 0;
            let currentLevel = 1;
            let currentQuestion = null;
            let gameActive = false;
            let questionCount = 0;
            let questionsInLevel = 5; // 每个等级的题目数量
            let startTime = null;
            let timerInterval = null;
            let elapsedTime = 0;
            let lastQuestion = null; // 用于记录上一道题
            let mistakesInLevel = []; // 记录当前等级的错题
            
            // DOM元素
            const scoreDisplay = document.getElementById('score');
            const levelDisplay = document.getElementById('current-level');
            const questionDisplay = document.getElementById('question');
            const answerInput = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            const startBtn = document.getElementById('start-btn');
            const resetBtn = document.getElementById('reset-btn');
            const gameStatus = document.getElementById('game-status');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const timerDisplay = document.getElementById('timer');
            const mistakesContainer = document.getElementById('mistakes-container');
            const mistakesList = document.getElementById('mistakes-list');
            const continueBtn = document.getElementById('continue-btn');
            
            // 根据等级生成题目
            function generateQuestion() {
                // 根据当前等级确定题目数量
                if (currentLevel <= 6) {
                    questionsInLevel = 5;
                } else {
                    questionsInLevel = 10;
                }
                
                let factor1, factor2;
                
                // 难度随等级递增
                if (currentLevel <= 3) {
                    // 等级1-3: 2-5的乘法 (避免1*1)
                    factor1 = Math.floor(Math.random() * 4) + 2; // 2-5
                    factor2 = Math.floor(Math.random() * 4) + 2; // 2-5
                } else if (currentLevel <= 6) {
                    // 等级4-6: 6-7的乘法
                    factor1 = Math.floor(Math.random() * 2) + 6; // 6-7
                    factor2 = Math.floor(Math.random() * 6) + 2; // 2-7
                } else {
                    // 等级7-10: 7-9的乘法
                    factor1 = Math.floor(Math.random() * 3) + 7; // 7-9
                    factor2 = Math.floor(Math.random() * 8) + 2; // 2-9
                }
                
                // 确保数字不超过9且不出现1*1
                factor1 = Math.min(factor1, 9);
                factor2 = Math.min(factor2, 9);
                
                // 避免1*1的情况
                if (factor1 === 1 && factor2 === 1) {
                    factor1 = 2;
                    factor2 = 2;
                }
                
                // 确保连续两道题不重复
                let attempts = 0;
                while (lastQuestion && 
                       attempts < 10 && 
                       ((factor1 === lastQuestion.num1 && factor2 === lastQuestion.num2) || 
                        (factor1 === lastQuestion.num2 && factor2 === lastQuestion.num1))) {
                    // 重新生成题目
                    if (currentLevel <= 3) {
                        factor1 = Math.floor(Math.random() * 4) + 2; // 2-5
                        factor2 = Math.floor(Math.random() * 4) + 2; // 2-5
                    } else if (currentLevel <= 6) {
                        factor1 = Math.floor(Math.random() * 2) + 6; // 6-7
                        factor2 = Math.floor(Math.random() * 6) + 2; // 2-7
                    } else {
                        factor1 = Math.floor(Math.random() * 3) + 7; // 7-9
                        factor2 = Math.floor(Math.random() * 8) + 2; // 2-9
                    }
                    
                    factor1 = Math.min(factor1, 9);
                    factor2 = Math.min(factor2, 9);
                    
                    // 避免1*1的情况
                    if (factor1 === 1 && factor2 === 1) {
                        factor1 = 2;
                        factor2 = 2;
                    }
                    
                    attempts++;
                }
                
                const question = {
                    num1: factor1,
                    num2: factor2,
                    answer: factor1 * factor2
                };
                
                // 更新上一道题的记录
                lastQuestion = question;
                
                return question;
            }
            
            // 格式化时间显示
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            // 更新计时器
            function updateTimer() {
                if (startTime) {
                    elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                    timerDisplay.textContent = formatTime(elapsedTime);
                }
            }
            
            // 启动计时器
            function startTimer() {
                startTime = Date.now() - elapsedTime * 1000;
                timerInterval = setInterval(updateTimer, 1000);
            }
            
            // 停止计时器
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }
            
            // 更新进度条
            function updateProgress() {
                const progress = (questionCount / questionsInLevel) * 100;
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${questionCount}/${questionsInLevel}`;
            }
            
            // 显示题目
            function displayQuestion() {
                currentQuestion = generateQuestion();
                questionDisplay.textContent = `${currentQuestion.num1} × ${currentQuestion.num2} = ?`;
                answerInput.value = '';
                answerInput.focus();
                gameStatus.textContent = '';
                gameStatus.className = 'game-status';
                
                // 更新进度文本
                updateProgress();
            }
            
            // 检查答案
            function checkAnswer() {
                if (!gameActive) return;
                
                const userAnswer = parseInt(answerInput.value);
                
                if (isNaN(userAnswer)) {
                    showStatus('请输入一个数字', 'incorrect');
                    return;
                }
                
                questionCount++;
                
                if (userAnswer === currentQuestion.answer) {
                    // 正确答案
                    // 根据等级给予不同分数，等级越高分数越高
                    const points = currentLevel * 10; // 等级越高，得分越高
                    score += points;
                    scoreDisplay.textContent = score;
                    showStatus('正确！', 'correct');
                } else {
                    // 错误答案
                    const mistake = {
                        question: `${currentQuestion.num1} × ${currentQuestion.num2}`,
                        userAnswer: userAnswer,
                        correctAnswer: currentQuestion.answer
                    };
                    mistakesInLevel.push(mistake);
                    
                    showStatus(`错误！正确答案是 ${currentQuestion.answer}`, 'incorrect');
                }
                
                // 检查是否完成当前等级
                if (questionCount >= questionsInLevel) {
                    if (currentLevel < 10) {
                        // 暂停游戏，显示错题
                        gameActive = false;
                        submitBtn.disabled = true;
                        answerInput.disabled = true;
                        
                        // 隐藏题目，显示错题
                        questionDisplay.style.display = 'none';
                        answerInput.style.display = 'none';
                        submitBtn.style.display = 'none';
                        mistakesContainer.style.display = 'block';
                        
                        // 显示错题
                        showMistakes();
                    } else {
                        // 完成所有等级
                        setTimeout(() => {
                            endGame();
                        }, 1500);
                    }
                } else {
                    setTimeout(displayQuestion, 1000); // 1秒后显示下一题
                }
            }
            
            // 显示错题
            function showMistakes() {
                mistakesList.innerHTML = '';
                
                if (mistakesInLevel.length > 0) {
                    mistakesInLevel.forEach(mistake => {
                        const mistakeItem = document.createElement('div');
                        mistakeItem.className = 'mistake-item';
                        mistakeItem.textContent = `${mistake.question} = ${mistake.correctAnswer} (你答: ${mistake.userAnswer})`;
                        mistakesList.appendChild(mistakeItem);
                    });
                } else {
                    const noMistakes = document.createElement('div');
                    noMistakes.className = 'mistake-item';
                    noMistakes.style.backgroundColor = '#d4edda';
                    noMistakes.style.color = '#155724';
                    noMistakes.textContent = '太棒了！本关没有错题！';
                    mistakesList.appendChild(noMistakes);
                }
            }
            
            // 显示游戏状态
            function showStatus(message, className) {
                gameStatus.textContent = message;
                gameStatus.className = `game-status ${className}`;
            }
            
            // 开始游戏
            function startGame() {
                if (gameActive) return;
                
                gameActive = true;
                questionCount = 0;
                score = 0;
                currentLevel = 1;
                elapsedTime = 0;
                lastQuestion = null;
                mistakesInLevel = [];
                
                scoreDisplay.textContent = score;
                levelDisplay.textContent = currentLevel;
                startBtn.disabled = true;
                submitBtn.disabled = false;
                answerInput.disabled = false;
                
                // 更新题目数量
                questionsInLevel = 5;
                
                // 重置进度条
                progressBar.style.width = '0%';
                progressText.textContent = `0/${questionsInLevel}`;
                
                // 重置计时器
                timerDisplay.textContent = '00:00';
                startTimer();
                
                // 隐藏错题显示区域
                mistakesContainer.style.display = 'none';
                questionDisplay.style.display = 'block';
                answerInput.style.display = 'flex';
                submitBtn.style.display = 'inline-block';
                
                displayQuestion();
            }
            
            // 进入下一关
            function nextLevel() {
                currentLevel++;
                
                // 根据等级更新题目数量
                if (currentLevel <= 6) {
                    questionsInLevel = 5;
                } else {
                    questionsInLevel = 10;
                }
                
                levelDisplay.textContent = currentLevel;
                questionCount = 0;
                lastQuestion = null;
                mistakesInLevel = [];
                
                // 隐藏错题显示区域
                mistakesContainer.style.display = 'none';
                questionDisplay.style.display = 'block';
                answerInput.style.display = 'flex';
                submitBtn.style.display = 'inline-block';
                
                // 更新进度条
                progressBar.style.width = '0%';
                progressText.textContent = `0/${questionsInLevel}`;
                
                showStatus(`恭喜进入第 ${currentLevel} 关！`, 'correct');
                
                setTimeout(() => {
                    gameActive = true;
                    submitBtn.disabled = false;
                    answerInput.disabled = false;
                    displayQuestion();
                }, 1500);
            }
            
            // 结束游戏
            function endGame() {
                gameActive = false;
                stopTimer();
                showStatus(`恭喜通关！总得分: ${score}，用时: ${formatTime(elapsedTime)}`, 'correct');
                
                // 显示烟火和撒花动画
                setTimeout(createFireworks, 500);
                setTimeout(createConfetti, 700);
                
                startBtn.disabled = false;
                submitBtn.disabled = true;
                answerInput.disabled = true;
            }
            
            // 重置游戏
            function resetGame() {
                gameActive = false;
                questionCount = 0;
                score = 0;
                currentLevel = 1;
                elapsedTime = 0;
                lastQuestion = null;
                mistakesInLevel = [];
                
                scoreDisplay.textContent = score;
                levelDisplay.textContent = currentLevel;
                questionDisplay.textContent = '点击开始游戏';
                gameStatus.textContent = '';
                gameStatus.className = 'game-status';
                answerInput.value = '';
                timerDisplay.textContent = '00:00';
                
                // 更新题目数量
                questionsInLevel = 5;
                
                // 重置进度条
                progressBar.style.width = '0%';
                progressText.textContent = `0/${questionsInLevel}`;
                
                // 隐藏错题显示区域
                mistakesContainer.style.display = 'none';
                questionDisplay.style.display = 'block';
                answerInput.style.display = 'flex';
                submitBtn.style.display = 'inline-block';
                
                stopTimer();
                
                startBtn.disabled = false;
                submitBtn.disabled = true;
                answerInput.disabled = true;
            }
            
            // 烟火效果
            function createFireworks() {
                const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000', '#ff1493', '#00ff80'];
                const container = document.body;
                const fireworkCount = 5; // 烟火爆炸数量
                
                for (let i = 0; i < fireworkCount; i++) {
                    setTimeout(() => {
                        const centerX = Math.random() * window.innerWidth;
                        const centerY = Math.random() * window.innerHeight / 2; // 限制在上半部分
                        
                        // 创建烟火中心点
                        const centerParticle = document.createElement('div');
                        centerParticle.className = 'firework';
                        centerParticle.style.left = `${centerX}px`;
                        centerParticle.style.top = `${centerY}px`;
                        centerParticle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        centerParticle.style.width = '8px';
                        centerParticle.style.height = '8px';
                        container.appendChild(centerParticle);
                        
                        // 创建爆炸粒子
                        const particleCount = 50;
                        for (let j = 0; j < particleCount; j++) {
                            const particle = document.createElement('div');
                            particle.className = 'firework';
                            particle.style.left = `${centerX}px`;
                            particle.style.top = `${centerY}px`;
                            
                            // 随机颜色
                            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                            
                            // 随机大小
                            const size = Math.random() * 6 + 2;
                            particle.style.width = `${size}px`;
                            particle.style.height = `${size}px`;
                            
                            container.appendChild(particle);
                            
                            // 计算随机方向和距离
                            const angle = Math.random() * Math.PI * 2;
                            const distance = Math.random() * 100 + 50;
                            const duration = Math.random() * 1 + 0.5;
                            
                            // 动画
                            particle.animate([
                                { transform: `translate(0, 0)`, opacity: 1 },
                                { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`, opacity: 0 }
                            ], {
                                duration: duration * 1000,
                                easing: 'cubic-bezier(0, .9, .57, 1)',
                            });
                            
                            // 移除粒子
                            setTimeout(() => {
                                particle.remove();
                            }, duration * 1000);
                        }
                        
                        // 移除中心点
                        setTimeout(() => {
                            centerParticle.remove();
                        }, 1000);
                    }, i * 400); // 错开时间释放烟火
                }
            }
            
            // 撒花动画
            function createConfetti() {
                const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000'];
                const container = document.body;
                const particleCount = 150;
                
                for (let i = 0; i < particleCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    // 随机颜色
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // 随机大小
                    const size = Math.random() * 10 + 5;
                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    
                    // 随机位置
                    confetti.style.left = `${Math.random() * 100}vw`;
                    
                    // 随机动画时长
                    const duration = Math.random() * 3 + 2;
                    confetti.style.animationDuration = `${duration}s`;
                    
                    // 随机延迟
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    
                    container.appendChild(confetti);
                    
                    // 移除已掉落的粒子
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000 + 2000);
                }
            }
            
            // 事件监听器
            submitBtn.addEventListener('click', checkAnswer);
            
            answerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && gameActive) {
                    checkAnswer();
                }
            });
            
            startBtn.addEventListener('click', startGame);
            
            resetBtn.addEventListener('click', resetGame);
            
            // 继续下一关按钮事件
            continueBtn.addEventListener('click', nextLevel);
            
            // 游戏开始时禁用输入
            submitBtn.disabled = true;
            answerInput.disabled = true;
        });
    </script>
</body>
</html>
